<main><h1><strong>OBJECTS</strong></h1>
<p><a href="glossary-ship.html">Ships</a>, <a href="glossary-obstacles.html">obstacles</a>, and <a href="glossary-device.html">devices</a> are all <strong>objects</strong>. The exact position of objects in the play area is tracked and restricted by game effects.</p>
<ul>
<li>
<p>Ships can acquire <a href="glossary-lock.html">locks</a> on objects.</p>
</li>
<li>
<p>Ships can <a href="glossary-move-through.html">move through</a> objects.</p>
</li>
</ul></main>
