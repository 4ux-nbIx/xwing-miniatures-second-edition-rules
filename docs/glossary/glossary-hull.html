<main><h1><strong>HULL</strong></h1>
<p><img alt="Hull value on a ship card" src="../assets/page-13-hull-value-on-a-ship-card.png" /></p>
<p>The yellow number on a ship card is the ship’s hull value. The hull value indicates how many damage cards it must have to be <a href="glossary-destroying-ships.html">destroyed</a>.</p>
<ul>
<li>The amount of <strong>hull remaining</strong> for a ship is the difference between the hull value and the number of damage cards it has.</li>
</ul></main>
