<main><h1><strong>DEFENDER</strong></h1>
<p>The ship that is chosen during the Declare Defender step of the Declare Target step of an <a href="glossary-attack.html">attack</a> is the defender.</p>
<ul>
<li>That ship remains the defender until after all “after attacking” and “after defending” abilities have resolved during the Aftermath step.</li>
</ul></main>
