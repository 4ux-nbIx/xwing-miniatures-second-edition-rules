<main><h1><strong>TITLE (</strong><i class="xwing-miniatures-font xwing-miniatures-font-title" role="img" aria-label="title" title="title"></i><strong>)</strong></h1>
<p>A title is a type of <a href="glossary-upgrade-cards.html">upgrade</a> that is used to represent a very specific version of a ship. Therefore, each title is restricted to a specific <a href="glossary-ship-type.html">ship type</a>. For example, the Millennium Falcon is a <i class="xwing-miniatures-font xwing-miniatures-font-title" role="img" aria-label="title" title="title"></i> upgrade.</p></main>
