<main><h1><strong>MISS</strong></h1>
<p>During the Neutralize Results step of an <a href="glossary-attack.html">attack</a>, the attack <strong>misses</strong> if no <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> or <i class="xwing-miniatures-font xwing-miniatures-font-crit" role="img" aria-label="critical-hit" title="critical-hit"></i> results remain. The attack <a href="glossary-hit.html">hits</a> if at least one <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> or <i class="xwing-miniatures-font xwing-miniatures-font-crit" role="img" aria-label="critical-hit" title="critical-hit"></i> result remain uncanceled.</p>
<ul>
<li>If the attack misses, the Deal Damage step of the attack is skipped.</li>
</ul></main>
