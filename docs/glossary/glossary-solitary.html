<main><h1><strong>SOLITARY</strong></h1>
<p>A squad cannot include more than one card of the same upgrade type with the “solitary” restriction. For example, since all <i class="xwing-miniatures-font xwing-miniatures-font-tacticalrelay" role="img" aria-label="tactical-relay" title="tactical-relay"></i> (Tactical Relay) upgrades have the solitary restriction, no squad can include more than one <i class="xwing-miniatures-font xwing-miniatures-font-tacticalrelay" role="img" aria-label="tactical-relay" title="tactical-relay"></i> upgrade.</p></main>
