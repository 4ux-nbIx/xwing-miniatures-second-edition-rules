<main><h1><strong>HIT</strong></h1>
<p>During the Neutralize Results step of an <a href="glossary-attack.html">attack</a>, the attack <strong>hits</strong> if at least one <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> or <i class="xwing-miniatures-font xwing-miniatures-font-crit" role="img" aria-label="critical-hit" title="critical-hit"></i> result remains uncanceled. If no <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> or <i class="xwing-miniatures-font xwing-miniatures-font-crit" role="img" aria-label="critical-hit" title="critical-hit"></i> results remain, the attack <a href="glossary-miss.html">misses</a>.</p></main>
