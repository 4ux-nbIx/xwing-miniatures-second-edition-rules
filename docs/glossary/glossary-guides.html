<main><h1><strong>GUIDES</strong></h1>
<p>Each ship’s base has two pairs of guides, one pair on the front and one pair on the back. Some <a href="glossary-device.html">devices</a> also have a pair of guides.</p>
<ul>
<li>Guides on a ship’s base are ignored only while measuring <a href="glossary-range.html">range</a> or determining whether a ship is in an <a href="glossary-arc.html">arc</a>.</li>
</ul></main>
