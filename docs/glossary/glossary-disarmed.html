<main><h1><strong>DISARMED</strong></h1>
<p>A ship is <strong>disarmed</strong> if it has at least one disarm token. A disarmed ship cannot perform <a href="glossary-attack.html">attacks</a>. The disarm token is a circular, orange <a href="glossary-tokens.html">token</a> and is removed during the <a href="glossary-end-phase.html">End Phase</a>.</p>
<p><img alt="Disarm token" src="../assets/page-11-disarm-token.png" /></p>
<ul>
<li>During the <a href="glossary-engagement-phase.html">Engagement Phase</a>, disarmed ships still engage (but cannot perform attacks).</li>
</ul></main>
