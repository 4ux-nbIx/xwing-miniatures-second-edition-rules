<main><h1><strong>Proximity Mine</strong></h1>
<figure><img src="../assets/page-26-proximity-mine-token.png" alt="Proximity Mine token"></figure>

<p><strong>Types:</strong> Device, Mine</p>
<p>After a ship overlaps or moves through this device, it detonates.</p>
<p>When this device detonates, that ship rolls 2 attack dice. That ship then suffers 1 <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> damage plus 1 <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i>/<i class="xwing-miniatures-font xwing-miniatures-font-crit" role="img" aria-label="critical-hit" title="critical-hit"></i> damage for each matching result.</p></main>
