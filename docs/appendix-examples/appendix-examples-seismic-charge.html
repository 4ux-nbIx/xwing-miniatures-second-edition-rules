<main><h1><strong>Seismic Charge</strong></h1>
<figure><img src="../assets/page-26-seismic-charge-token.png" alt="Seismic Charge token"></figure>

<p><strong>Types:</strong> Device, Bomb</p>
<p>At the end of the Activation Phase, this device detonates.</p>
<p>When this device detonates, choose 1 obstacle at range 0–1. <span style="color: #00aeef">The obstacle deals 1 <i class="xwing-miniatures-font xwing-miniatures-font-hit" role="img" aria-label="hit" title="hit"></i> damage to each ship and remote at range 0–1</span>. Then remove that obstacle.</p></main>
