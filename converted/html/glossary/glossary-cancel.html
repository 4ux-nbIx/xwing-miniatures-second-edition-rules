<main><h1><strong>CANCEL</strong></h1>
<p>When a die result is canceled, a player takes one die displaying the canceled result and physically removes the die from the common area. Players ignore all canceled results.</p>
<ul>
<li>Canceling dice does not count as <a href="glossary-dice-modification.html">modifying dice</a>.</li>
</ul></main>
