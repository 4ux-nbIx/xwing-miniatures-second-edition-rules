<main><h1><strong>SIMULTANEOUS FIRE</strong></h1>
<p>To represent that ships with the same initiative are essentially attacking at the same time, if a ship is <a href="glossary-destroying-ships.html">destroyed</a> during the <a href="glossary-engagement-phase.html">Engagement Phase</a>, it is <a href="glossary-removed-from-the-game.html">removed</a> after all ships that have the same initiative as the currently engaged ship have engaged.</p></main>
