<main><h1><strong>SHIP TYPE</strong></h1>
<p>Each ship has a ship type that is identified by the name of the type of ship listed on the bottom of its ship cards.</p>
<ul>
<li>
<p>Each ship must use the <a href="glossary-dial.html">dial</a> that matches their ship type.</p>
</li>
<li>
<p>Some <a href="glossary-upgrade-cards.html">upgrade cards</a> have ship restrictions that refer to ship type.</p>
</li>
</ul></main>
