<main><h1><strong>ATTACK ARC</strong></h1>
<p>During an <a href="glossary-attack.html">attack</a>, the <strong>attack arc</strong> is the <a href="glossary-arc.html">arc</a> that corresponds to the weapon the attacker is using. During the Declare Defender step, the opposing ship needs to be in the attack arc.</p></main>
